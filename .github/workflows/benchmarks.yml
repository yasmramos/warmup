name: Benchmarks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build project and benchmarks JAR
      run: mvn -B package -DskipTests -pl warmup-benchmarks -am

    - name: Run Benchmarks
      run: |
        echo "Running all benchmarks automatically..."
        java -jar warmup-benchmarks/target/benchmarks.jar

    - name: Upload Benchmark Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-results
        path: |
          **/target/jmh-result.json
          **/target/jmh-result.csv
        retention-days: 30
