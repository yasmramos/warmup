name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Build and Test
      run: mvn -q package
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/surefire-reports/*.xml'
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: '**/target/site/jacoco/'

  dependency-submission:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Generate Maven Dependency Graph
      run: |
        mvn org.github.maven.plugins:depgraph-maven-plugin:4.0.1:generate \
          -DgenerateDependencyGraph=true \
          -Dscope=compile \
          -DoutputFile=dependency-graph.json || echo "Dependency graph generation skipped"
    
    - name: Submit Dependencies to GitHub
      uses: advanced-security/maven-dependency-submission-action@v3
      with:
        directory: .
      continue-on-error: true
